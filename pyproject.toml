[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbom-builder"
version = "0.1.0"
description = "Analyze OT protocol and identity components against a PQC readiness crosswalk and produce a Cryptographic Bill of Materials (CBOM)."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Friday Ogochukwu Ikwuogu", email = "fo.ikwuogu@gmail.com" },
]
requires-python = ">=3.9"
dependencies = [
    "cryptography>=41.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
cbom-builder = "cbom_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cbom_builder = ["data/*.json"]
